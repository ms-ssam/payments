spring:
  application:
    name: payments
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/toss}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

toss:
  payments:
    client-key: ${TOSS_CLIENT_KEY}
    secret-key: ${TOSS_SECRET_KEY}
    base-url: https://api.tosspayments.com

app:
  base-url: http://localhost:8080  #  나중에 컨트롤러에서 successUrl/failUrl 만들 때 사용할 값

payments:
  settlement:
    fee-rate: 0.029   # 학습용 고정값. 실제 Toss 수수료와 무관함(실무에선 PG가 계산해 알려주는 값)