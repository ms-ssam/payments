spring:
  application:
    name: payments
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/toss}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

toss:
  payments:
    client-key: ${TOSS_CLIENT_KEY}
    secret-key: ${TOSS_SECRET_KEY}
    base-url: https://api.tosspayments.com
    # 토스 공식 권장값은 확인되지 않아 임의로 정한 값. 운영 로그를 보며 조정한다
    connect-timeout: 1500ms     # 초과 시 요청이 토스에 도달하지 않은 것 → 확정 실패
    payment-read-timeout: 5s    # 승인·취소. 초과 시 같은 멱등키로 1회 재요청(토스가 처리를 끝냈으면 저장된 결과를 바로 돌려줌)
    inquiry-read-timeout: 3s    # 결제 조회

app:
  base-url: http://localhost:8080  #  나중에 컨트롤러에서 successUrl/failUrl 만들 때 사용할 값

payments:
  settlement:
    fee-rate: 0.029   # 학습용 고정값. 실제 Toss 수수료와 무관함(실무에선 PG가 계산해 알려주는 값)